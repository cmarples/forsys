# Input file for the TenseFlex user project in Chaste
# Used to generate ground truth data to use in validating ForSys.

[File]

# directory for output files
OutputDirectory = X_Furrow_K_0p1



[Time]

# if true, will run an equilibration phase followed by a sampling phase
# if false, just run the sampling phase
IsEquilibration = true

# total simulated time; > 0
EquilibrationSimulationTime = 100.0
SamplingSimulationTime = 100.0

# output snapshot after this many time-steps; integer > 0
EquilibrationStepsBetweenWrites = 50
SamplingStepsBetweenWrites = 50

# simulation time-step; > 0
TimeStep = 0.02



[InitialTissue]

# number of points along each dimension for Voronoi tessellation; > 2
NumCellsX = 8
NumCellsY = 8

# characteristic length scale of each cell
# initial mean target area is given by the LengthScale squared
CellLengthScale = 20.0

# standard deviation for Gaussian noise to initial grid positions (prior to tessellation)
InitialGaussianNoise = 1.0



[Force]

# farhadifar law area stiffness; > 0
FarhadifarAreaElasticity = 0.1

# farhadifar law perimeter contractility; >= 0
FarhadifarPerimeterContractility = 0.04

# average target cell area; > 0
TargetAreaMean = 450.0

# spread in target area (mean equal to initial average); >= 0
TargetAreaStandardDeviation = 5.0



[LineTension]

# initial line tensions drawn from a Gaussian distribution
InitialMean = 1.0
InitialStandardDeviation = 0.1

# options: Normal, XAxisFurrow, YAxisFurrow, CircularFurrow, Random
LineTensionCondition = XAxisFurrow

# parameters for furrow conditions (XAxisFurrow, YAxisFurrow, CircularFurrow)
FurrowMean = 6.0
FurrowStandardDeviation = 20.0

# parameters for random condition (Random)
# can have multiple possible means, separated by commas.
# standard deviation given by SpreadFactor * Mean
CandidateMeans = 1.0, 1.1, 1.2, 1.3, 1.5
SpreadFactor = 0.5